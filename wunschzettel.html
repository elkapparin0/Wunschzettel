<!DOCTYPE html>

              <strong>~30€ ±</strong>
              <small> nicht übermäßig groß</small>
            </span>
          </label>
        </li>
        <li class="wish-item">
          <label>
            <input type="checkbox" data-id="stuhl"/>
            <span>Ergonomischer Bürostuhl (als neuer Schreibtischstuhl für mich) <strong>???€</strong></span>
          </label>
        </li>
      </ul>

    <section class="wishlist-section" aria-labelledby="gelesene-buecher">
      <h2 id="gelesene-buecher">Schon gelesen, aber als physische Bücher gewünscht</h2>
      <ul class="wishlist">
        <li class="wish-item">
          <label>
            <input type="checkbox" data-id="dreiSonnen"/>
            <span><a href="https://www.thalia.de/shop/home/artikeldetails/A1038189458" target="_blank" rel="noopener noreferrer">Die Drei Sonnen von Cixin Liu</a> <strong>18€</strong></span>
          </label>
        </li>
        <li class="wish-item">
          <label>
            <input type="checkbox" data-id="Dunkle Wald"/>

      <h2 id="weitere-buecher">Weitere Bücher</h2>

      <article class="wish-group">
        <label class="group-title">
          <input type="checkbox" />

        <ul class="wishlist wishlist--nested">
          <li class="wish-item"><label><input type="checkbox" data-id="Farseer2"/><span><a href="https://www.thalia.de/shop/home/artikeldetails/A1033025164" target="_blank" rel="noopener noreferrer">Band 2: Royal Assassin</a> <strong>~14€</strong></span></label></li>
          <li class="wish-item"><label><input type="checkbox" data-id="Farseer3"/><span><a href="https://www.thalia.de/shop/home/artikeldetails/A1033025166" target="_blank" rel="noopener noreferrer">Band 3: Assassin's Quest</a> <strong>~14€</strong></span></label></li>

        <label class="group-title">

        <ul class="wishlist wishlist--nested">

          <li class="wish-item"><label><input type="checkbox" data-id="GOT3"/><span><a href="https://www.thalia.de/shop/home/artikeldetails/A1001451757" target="_blank" rel="noopener noreferrer">Band 3: A Storm of Swords</a> <strong>~10€</strong></span></label></li>
        </ul>

    </section>

    <section class="wishlist-section" aria-labelledby="weitere">
      <h2 id="weitere">Weitere</h2>
      <ul class="wishlist">
        <li class="wish-item"><label><input type="checkbox" data-id="empireVampire"/><span><a href="https://www.thalia.de/shop/home/artikeldetails/A1063739533" target="_blank" rel="noopener noreferrer">Empire of the Vampire Band 1</a> <strong>~10€</strong></span></label></li>
